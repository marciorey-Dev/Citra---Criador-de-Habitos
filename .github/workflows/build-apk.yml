name: Compilar APK Android (Citra)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variante de compilação'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Compilar APK de Teste Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código-fonte
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (Temurin)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Configurar Gradle oficial
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Configurar Android SDK e Build Tools
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      # 5. Aceitar todas as licenças do Android SDK
      - name: Aceitar todas as licenças do Android SDK
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses 2>/dev/null || true
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      # 6. Restaurar Debug Keystore para assinatura compatível com Firebase
      - name: Restaurar Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restaurando debug.keystore a partir do arquivo base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Criando debug.keystore padrao..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 7. Garantir arquivo de ambiente (.env), local.properties e credenciais do Firebase
      - name: Preparar ambiente e credenciais
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Restaurando app/google-services.json a partir do segredo..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            fi
          fi

      # 8. Normalizar finais de linha e permissão de execução no script do Gradle
      - name: Preparar gradlew
        run: |
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew

      # 9. Compilar APK com Gradle
      - name: Compilar Citra APK
        run: |
          VARIANT="${{ github.event.inputs.build_variant || 'debug' }}"
          echo "Compilando variante: $VARIANT"
          if [ "$VARIANT" = "release" ] && [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decodificando chave de release..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.jks 2>/dev/null || echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
            export KEYSTORE_PATH="$(pwd)/release-key.jks"
            export STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
            ./gradlew --no-daemon --no-configuration-cache assembleRelease --stacktrace
          else
            ./gradlew --no-daemon --no-configuration-cache assembleDebug --stacktrace
          fi

      # 10. Coletar e organizar APKs gerados
      - name: Organizar APKs gerados
        shell: bash
        run: |
          mkdir -p build-artifacts
          APK_DIR="app/build/outputs/apk"
          if [ ! -d "$APK_DIR" ]; then
            echo "Erro: pasta $APK_DIR nao encontrada!"
            exit 1
          fi
          count=0
          while IFS= read -r -d '' apk; do
            filename=$(basename "$apk")
            variant=$(basename "$(dirname "$apk")")
            echo "Copiando APK: $apk"
            cp "$apk" "build-artifacts/Citra-${variant}-${filename}"
            count=$((count + 1))
          done < <(find "$APK_DIR" -type f -name "*.apk" -print0)
          if [ "$count" -eq 0 ]; then
            echo "Nenhum APK foi gerado!"
            exit 1
          fi
          echo "Conteudo da pasta build-artifacts:"
          ls -lh build-artifacts/

      # 11. Disponibilizar APK nos Artifacts do GitHub para download imediato
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Citra-Test-APK
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # 12. Se for uma tag (ex: v1.2.4), criar Release no GitHub com o APK anexado
      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
