
name: Compilar APK de Testes (Citra)

on:
  push:
    branches: [ "**" ]

  pull_request:
    branches: [ "**" ]

  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de compilação"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      # 1. Obter o código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # 4. Preparar Gradle Wrapper
      - name: Preparar Gradle
        run: chmod +x ./gradlew

      # 5. Compilar APK
      - name: Compilar Citra
        run: |
          echo "Tipo de compilação: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew --no-daemon assembleRelease --stacktrace
          else
            ./gradlew --no-daemon assembleDebug --stacktrace
          fi

      # 6. Organizar APKs
      - name: Coletar APKs gerados
        shell: bash
        run: |
          mkdir -p build-artifacts

          APK_DIR="app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "Erro: pasta de APKs não encontrada."
            exit 1
          fi

          count=0

          while IFS= read -r -d '' apk; do
            filename=$(basename "$apk")
            variant=$(basename "$(dirname "$apk")")

            cp "$apk" "build-artifacts/Citra-${variant}-${filename}"

            count=$((count + 1))
          done < <(find "$APK_DIR" -type f -name "*.apk" -print0)

          if [ "$count" -eq 0 ]; then
            echo "Erro: nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs gerados:"
          ls -lh build-artifacts/

      # 7. Disponibilizar APKs para download
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Citra-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
          
