
name: Compilar APK de Testes (Citra)

on:
  push:
    branches: [ "**" ]

  pull_request:
    branches: [ "**" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # 4. Criar Debug Keystore
      - name: Criar Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Criando chave Debug..."

            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else
            echo "Debug Keystore já existe."
          fi

      # 5. Preparar Gradle
      - name: Preparar Gradle
        run: chmod +x ./gradlew

      # 6. Compilar APK Debug
      - name: Compilar Citra
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # 7. Organizar APKs
      - name: Coletar APKs gerados
        shell: bash
        run: |
          mkdir -p build-artifacts

          APK_DIR="app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "Erro: pasta de APKs não encontrada."
            exit 1
          fi

          count=0

          while IFS= read -r -d '' apk; do
            filename=$(basename "$apk")
            variant=$(basename "$(dirname "$apk")")

            cp "$apk" "build-artifacts/Citra-${variant}-${filename}"
            count=$((count + 1))
          done < <(find "$APK_DIR" -type f -name "*.apk" -print0)

          if [ "$count" -eq 0 ]; then
            echo "Nenhum APK foi gerado!"
            exit 1
          fi

          echo "APKs gerados:"
          ls -lh build-artifacts/

      # 8. Disponibilizar APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Citra-Debug-${{ github.run_number }}
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
