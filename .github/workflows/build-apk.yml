
name: Build Android APK (Citra)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Citra Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 4. Preparar Gradle Wrapper
      - name: Preparar Gradle
        run: chmod +x ./gradlew

      # 5. Compilar APK Debug
      - name: Compilar Citra
        run: ./gradlew --no-daemon assembleDebug

      # 6. Disponibilizar APK
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Citra-Debug-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
