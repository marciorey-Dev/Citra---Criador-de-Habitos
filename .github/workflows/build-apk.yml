name: Build Android APK (Citra)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilação'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Restaurar Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore a partir de debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Criando debug.keystore padrão..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Garantir arquivo de ambiente (.env)
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Compilar APK com Gradle
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_CHOICE" = "release" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Compilando APK Release assinado..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Compilando APK Debug..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Organizar APKs gerados
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "build-artifacts/Citra-v1.2.4-release.apk"
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/Citra-v1.2.4-debug.apk"
          fi
          ls -la build-artifacts/

      - name: Disponibilizar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Citra-v1.2.4-APK
          path: build-artifacts/*.apk
          retention-days: 30
