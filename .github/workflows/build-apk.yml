name: Compilar APK de Testes (Citra)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilação'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Aceitar licenças do Android SDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Restaurar ou Criar Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore a partir de debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Criando debug.keystore padrão..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar arquivo de ambiente (.env)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Compilar APK com Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Iniciando compilação do APK no modo: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "release" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Coletar e Organizar APKs
        run: |
          mkdir -p build-artifacts
          # Copia qualquer APK gerado
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build-artifacts/ \;
          
          # Cria atalhos com nomes claros para facilitar o download
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Citra-teste-debug.apk
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/Citra-teste-release.apk
          fi

          echo "APKs organizados com sucesso:"
          ls -la build-artifacts/

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Citra-APK-Testes
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
