name: Compilar APK Android (Citra)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variante de compilação'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: 'Executar testes unitários antes de gerar o APK'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android (Citra)
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código-fonte
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (Temurin)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Configurar Android SDK, API 36.1 (compileSdk) e Build Tools
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36.1 platforms;android-36 build-tools;36.0.0'

      # 4. Garantir pacotes e licenças do Android SDK (incluindo android-36.1)
      - name: Garantir pacotes e licenças do Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
              "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"
            fi
          else
            echo "::warning::sdkmanager não encontrado; usando pacotes pré-configurados no runner."
          fi
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      # 5. Configurar cache oficial do Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Restaurar Debug Keystore para assinatura compatível com Firebase / Google Sign-In
      - name: Restaurar Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restaurando debug.keystore a partir de debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Criando debug.keystore padrão..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      # 7. Garantir .env.example, .env, local.properties e google-services.json
      - name: Preparar ambiente e credenciais
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f ".env.example" ]; then
            printf 'GEMINI_API_KEY=\n' > .env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          fi
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "Restaurando app/google-services.json a partir do segredo..."
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::warning::app/google-services.json ausente e secret GOOGLE_SERVICES_JSON não configurado."
            fi
          fi

      # 8. Verificar e preparar Gradle Wrapper (gradlew)
      - name: Preparar Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Arquivo gradle/wrapper/gradle-wrapper.jar não encontrado no repositório!"
            exit 1
          fi
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      # 9. Executar testes unitários (quando habilitado no disparo manual)
      - name: Executar testes unitários
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == true }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testDebugUnitTest --stacktrace

      # 10. Compilar APK com Gradle
      - name: Compilar Citra APK
        id: build_apk
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          GRADLE_OPTS_CI=("-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8")
          COMMON_FLAGS=(--no-daemon --no-configuration-cache --max-workers=2 --stacktrace)

          if [ "$BUILD_VARIANT" = "release" ] && [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Decodificando keystore de release (alias esperado: upload)..."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release-key.jks
            export KEYSTORE_PATH="$(pwd)/release-key.jks"
            export STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            ./gradlew "${COMMON_FLAGS[@]}" "${GRADLE_OPTS_CI[@]}" assembleRelease
            echo "actual_variant=release" >> "$GITHUB_OUTPUT"
          else
            if [ "$BUILD_VARIANT" = "release" ]; then
              echo "::warning::Secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD ou RELEASE_KEY_PASSWORD ausentes. Gerando Debug APK como fallback."
            fi
            ./gradlew "${COMMON_FLAGS[@]}" "${GRADLE_OPTS_CI[@]}" assembleDebug
            echo "actual_variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # 11. Limpar keystore temporária de release
      - name: Limpar arquivos temporários de assinatura
        if: always()
        run: rm -f release-key.jks

      # 12. Coletar, organizar APKs gerados e escrever resumo
      - name: Organizar APKs gerados
        shell: bash
        run: |
          mkdir -p build-artifacts
          APK_DIR="app/build/outputs/apk"
          if [ ! -d "$APK_DIR" ]; then
            echo "Erro: pasta $APK_DIR não encontrada!"
            exit 1
          fi
          count=0
          while IFS= read -r -d '' apk; do
            filename=$(basename "$apk")
            variant=$(basename "$(dirname "$apk")")
            target="build-artifacts/Citra-${variant}-${filename}"
            echo "Copiando APK: $apk -> $target"
            cp "$apk" "$target"
            count=$((count + 1))
          done < <(find "$APK_DIR" -type f -name "*.apk" -print0)
          if [ "$count" -eq 0 ]; then
            echo "Nenhum APK foi gerado!"
            exit 1
          fi
          ls -lh build-artifacts/

          {
            echo "## 📦 Compilação do Citra Concluída"
            echo "- **Variante gerada:** \`${{ steps.build_apk.outputs.actual_variant }}\`"
            echo "- **Branch / Ref:** \`${{ github.ref_name }}\`"
            echo ""
            echo "### Arquivos gerados"
            for f in build-artifacts/*.apk; do
              size=$(du -h "$f" | cut -f1)
              echo "- \`$(basename "$f")\` ($size)"
            done
            echo ""
            echo "Baixe o pacote **Citra-Test-APK** na seção **Artifacts** abaixo."
          } >> "$GITHUB_STEP_SUMMARY"

      # 13. Disponibilizar APK nos Artifacts do GitHub
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Citra-Test-APK
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publicar Release no GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: Citra-Test-APK
          path: build-artifacts

      - name: Anexar APK à Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
